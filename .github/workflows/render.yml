name: Render 3D Video

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Verify Chrome and FFmpeg
        run: |
          google-chrome --version
          ffmpeg -version

      - name: Render MP4 Video (Headless Chrome + Three.js + FFmpeg)
        env:
          SOFTWARE_GL: 1
          QS: '&res=0.7&aa=0&shadow=1024'
          FPS: 24
        run: |
          cd coffee-king
          node tools/capture.mjs check
          node tools/capture.mjs video renders/coffee-king.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coffee-king-mp4
          path: coffee-king/renders/coffee-king.mp4
          retention-days: 7
